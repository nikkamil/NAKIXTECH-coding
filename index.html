<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartLab Coding Library</title>
<style>
:root{color-scheme:dark;--bg:#101722;--panel:#172334;--border:#334258;--text:#e9f1fa;--muted:#a7b6c9;--accent:#61dfbc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}header{border-bottom:1px solid var(--border);padding:26px 20px}header div,main{max-width:1000px;margin:auto}header h1{font-size:clamp(24px,5vw,34px);margin:0;color:var(--accent)}header p{margin:4px 0 0;color:var(--muted)}main{padding:24px 16px 40px}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}h2{margin:0 0 8px;font-size:24px}h3{font-size:16px;margin:0 0 12px}p{margin:8px 0 16px}input,button,a.action{font:inherit;border-radius:8px;padding:10px 12px}input{width:100%;color:var(--text);background:var(--bg);border:1px solid var(--border)}button,a.action{cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text);text-decoration:none}button:hover,a.action:hover,button:focus-visible{border-color:var(--accent)}button.primary{background:var(--accent);color:#10251f;font-weight:700;border-color:var(--accent)}#list{display:grid;gap:8px;margin-top:12px}#list button{text-align:left}#list button[aria-current=true]{border-color:var(--accent);color:var(--accent)}.small{color:var(--muted);font-size:13px}.tag{display:inline-block;border:1px solid var(--border);border-radius:20px;padding:4px 10px;color:var(--accent);font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}pre{background:#0c121c;border:1px solid var(--border);border-radius:10px;overflow:auto;padding:16px;color:#b4ead8;font:14px/1.65 ui-monospace,Consolas,monospace;tab-size:2;margin:12px 0}#link{font-size:13px}#status{min-height:1.5em;margin:8px 0 0;color:var(--accent)}@media(max-width:700px){.layout{grid-template-columns:1fr}.panel{padding:14px}header{padding:20px 16px}}
</style>
</head>
<body>
<header><div><h1>SmartLab Coding Library</h1><p>Arduino &amp; ESP32 • Kod eksperimen pembelajaran</p></div></header>
<main class="layout">
<aside class="panel"><h3>Senarai eksperimen</h3><input id="search" type="search" placeholder="Cari eksperimen..." aria-label="Cari eksperimen"><nav id="list" aria-label="Senarai eksperimen"></nav></aside>
<article class="panel"><span class="tag" id="board"></span><h2 id="title"></h2><p id="description"></p><div class="actions"><button id="copy" class="primary">Copy Code</button><button id="download">Download .ino</button><button id="share">Salin pautan QR</button></div><div class="small" id="filename"></div><pre><code id="code"></code></pre><label class="small" for="link">Pautan eksperimen (gunakan URL online untuk QR Code)</label><input id="link" readonly><p id="status" role="status"></p></article>
</main>
<script>
// =====================================================
// TAMBAH ATAU EDIT CODING DI BAHAGIAN INI SAHAJA.
// Setiap id mesti unik. Jangan tukar id selepas QR dicetak.
// =====================================================
const experiments = [
  {
    id: 'led-blink',
    title: '01 — LED Blinking',
    board: 'Arduino UNO',
    description: 'LED terbina dalam berkelip setiap satu saat.',
    filename: 'LED_Blink.ino',
    code: `void setup() {
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop() {
  digitalWrite(LED_BUILTIN, HIGH);
  delay(1000);
  digitalWrite(LED_BUILTIN, LOW);
  delay(1000);
}`
  },
  {
    id: 'traffic-light',
    title: '02 — Traffic Light',
    board: 'Arduino UNO',
    description: 'LED merah D8, kuning D9, hijau D10. Gunakan resistor 220–330 ohm untuk setiap LED.',
    filename: 'Traffic_Light.ino',
    code: `const int red = 8;
const int yellow = 9;
const int green = 10;

void setup() {
  pinMode(red, OUTPUT);
  pinMode(yellow, OUTPUT);
  pinMode(green, OUTPUT);
}

void loop() {
  digitalWrite(red, HIGH);
  delay(5000);
  digitalWrite(red, LOW);
  digitalWrite(green, HIGH);
  delay(5000);
  digitalWrite(green, LOW);
  digitalWrite(yellow, HIGH);
  delay(2000);
  digitalWrite(yellow, LOW);
}`
  },
  {
    id: 'esp32-led',
    title: '03 — ESP32 LED Blinking',
    board: 'ESP32 DevKit 38-pin',
    description: 'LED luaran pada GPIO25 melalui resistor 220–330 ohm ke GND.',
    filename: 'ESP32_LED.ino',
    code: `const int led = 25;

void setup() {
  pinMode(led, OUTPUT);
}

void loop() {
  digitalWrite(led, HIGH);
  delay(1000);
  digitalWrite(led, LOW);
  delay(1000);
}`
  }
];
// =====================================================
// Fungsi website. Tidak perlu ubah untuk tambah eksperimen.
// =====================================================
const $ = id => document.getElementById(id);
let current = experiments[0];
function urlFor(id) {
  const url = new URL(location.href);
  url.search = '';
  url.hash = '';
  url.searchParams.set('code', id);
  return url.href;
}
function renderList() {
  const q = $('search').value.trim().toLowerCase();
  $('list').replaceChildren();
  for (const item of experiments.filter(e => (e.title+' '+e.board+' '+e.id).toLowerCase().includes(q))) {
    const b = document.createElement('button');
    b.textContent = item.title;
    b.setAttribute('aria-current', String(item.id === current.id));
    b.addEventListener('click', () => select(item, true));
    $('list').append(b);
  }
  if (!$('list').children.length) $('list').textContent = 'Tiada eksperimen dijumpai.';
}
function select(item, push) {
  current = item;
  if (push) { try { history.pushState(null, '', urlFor(item.id)); } catch {} }
  $('title').textContent = item.title;
  $('board').textContent = item.board;
  $('description').textContent = item.description;
  $('filename').textContent = item.filename;
  $('code').textContent = item.code;
  $('link').value = urlFor(item.id);
  $('status').textContent = '';
  renderList();
}
function fromURL() {
  const id = new URLSearchParams(location.search).get('code');
  const found = experiments.find(e => e.id === id);
  select(found || experiments[0], false);
  if (id && !found) $('status').textContent = 'Kod eksperimen tidak dijumpai.';
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const field = document.createElement('textarea');
  field.value = text;
  field.style.cssText = 'position:fixed;left:-9999px';
  document.body.append(field); field.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  field.remove(); return ok;
}
$('copy').addEventListener('click', async () => {
  $('status').textContent = await copyText(current.code) ? 'Coding telah disalin.' : 'Tidak dapat salin secara automatik. Pilih dan salin teks kod secara manual.';
});
$('share').addEventListener('click', async () => {
  if (location.protocol === 'file:') { $('status').textContent = 'Terbitkan website dahulu. Pautan fail tempatan tidak boleh digunakan oleh telefon lain.'; return; }
  $('status').textContent = await copyText(urlFor(current.id)) ? 'Pautan eksperimen telah disalin.' : 'Salin pautan secara manual dari kotak di atas.';
});
$('download').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([current.code+'\n'], {type:'text/plain'}));
  const a = document.createElement('a'); a.href=url; a.download=current.filename;
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  $('status').textContent = 'Muat turun dimulakan.';
});
$('search').addEventListener('input',renderList);
window.addEventListener('popstate',fromURL);
fromURL();
</script>
</body>
</html>
