<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartLab • Admin</title><link rel="stylesheet" href="style.css"></head><body><header><strong>SMARTLAB / ADMIN PANEL</strong><a href="index.html">Website pelajar</a></header><main><h1>Manage coding</h1><p id="status" class="status" role="status"></p><section id="login"><h2>Login admin</h2><form id="loginform"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><p><button class="primary">Login</button></p></form></section><div id="dashboard" hidden><div class="row between"><div id="stats" class="stats"></div><button id="logout">Logout</button></div><div class="layout"><section><div class="row between"><h2>Library</h2><button id="new" class="primary">+ Add</button></div><input id="search" placeholder="Cari coding…" aria-label="Cari coding"><div id="list"></div></section><section><h2 id="editorTitle">Tambah coding</h2><form id="editor"><label for="title">Tajuk</label><input id="title" required maxlength="150"><label for="board">Board</label><input id="board" required placeholder="Arduino UNO / ESP32"><label for="category">Kategori</label><input id="category" required placeholder="Sensor / Motor / LED"><label for="description">Penerangan</label><textarea id="description" rows="3"></textarea><label for="filename">Nama fail .ino / .txt</label><input id="filename" required pattern="[A-Za-z0-9_.\-]+\.(ino|txt|cpp|h|py|js|html)" value="Sketch.ino"><label for="code">Coding</label><textarea id="code" class="code" rows="14" required spellcheck="false"></textarea><label><input id="published" type="checkbox"> Publish (boleh dilihat oleh orang awam)</label><p class="row"><button id="save" class="primary">Save Coding</button><button id="delete" type="button" class="danger" disabled>Delete</button></p></form><div id="qrpanel" hidden><hr><h2>QR Code eksperimen</h2><p class="muted">Pautan kekal selagi rekod tidak dipadam.</p><input id="link" readonly aria-label="Pautan eksperimen"><div class="qr" id="qr"></div><div class="row"><button id="copylink" type="button">Copy Link</button><button id="downloadqr" type="button">Download QR PNG</button><a id="preview" target="_blank" rel="noopener">Buka coding</a></div></div></section></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
